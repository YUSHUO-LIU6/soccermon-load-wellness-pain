name: Reproducibility checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the locked analytical test environment
        run: |
          python -m pip install uv==0.11.31
          uv sync --frozen
      - name: Check source integrity, acceptance gates and numerical instrumentation
        run: uv run python -m unittest discover -s tests -v
      - name: Parse Python sources without executing analyses
        run: uv run python -m compileall -q analysis scripts tests
